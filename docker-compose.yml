services:
  config-orchestrator:
    image: proxy-fleet-rust:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME_BASE: runtime-cached
    container_name: config-orchestrator
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      HOME: /home/app
      # A deliberate operator switch for maintenance/cutover.  It defaults to
      # enabled, so the normal service behaviour is unchanged.
      PROXY_FLEET_PUBLISHING_ENABLED: "${PROXY_FLEET_PUBLISHING_ENABLED:-true}"
      GIT_SSH_COMMAND: "ssh -i /run/secrets/github_ssh_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o Hostname=ssh.github.com -p 443"
    volumes:
      - ./data:/app/data
      - ./config/config.yml:/app/config/config.yml:ro
      - /home/h-mousavi/.ssh/id_ed25519:/run/secrets/github_ssh_key:ro
      - /home/h-mousavi/.ssh/known_hosts:/home/app/.ssh/known_hosts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
