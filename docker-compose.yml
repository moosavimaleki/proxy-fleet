services:
  config-orchestrator:
    image: src-config-orchestrator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: config-orchestrator
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      GIT_SSH_COMMAND: "ssh -i /run/secrets/github_ssh_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o Hostname=ssh.github.com -p 443"
    volumes:
      - ./data:/app/data
      - ./config/config.yml:/app/config/config.yml:ro
      - /home/h-mousavi/.ssh/id_ed25519:/run/secrets/github_ssh_key:ro
      - /home/h-mousavi/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
