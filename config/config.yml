service:
  name: config-orchestrator
  environment: production

publishing:
  enabled: true
  git_remote: "git@github.com:moosavimaleki/proxy-fleet.git"
  git_branch: main
  debounce_seconds: 2
  reconcile_interval_seconds: 60
  retained_snapshots: 3
  author_name: "Proxy Fleet"
  author_email: "proxy-fleet@users.noreply.github.com"

subscriptions:
  refresh_interval_seconds: 300
  # Delete unhealthy entries only after two complete successful refreshes miss them.
  prune_missing_after_cycles: 2
  urls:
    - name: sub_1
      url: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub1.txt"
    - name: sub_2
      url: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub2.txt"
    - name: sub_3
      url: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub3.txt"
    - name: sub_4
      url: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub4.txt"
    - name: sub_5
      url: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub5.txt"
    - name: sub_6
      url: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub6.txt"
    - name: sub_7
      url: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub7.txt"
    - name: sub_8
      url: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub8.txt"
ports:
  main:
    start: 30000
    end: 31999
  test:
    start: 32000
    end: 39999

database:
  type: sqlite
  path: ./data/app.db

health:
  # A real-download success is protected from normal demotion for 15–30 min.
  active_min_residence_seconds: 1800
  active_pool_relay_check_interval_seconds: 10
  # A node stays ACTIVE only if real downloads still work from this host/network.
  active_pool_download_check_interval_seconds: 300
  # One transient TLS timeout must not eject a previously working node.
  active_relay_failure_threshold: 3
  probation_recheck_interval_seconds: 120
  probation_failure_threshold: 3
  probation_success_threshold: 1
  candidate_recheck_interval_seconds: 10
  # Transient failures get increasingly sparse retries; chronic failures leave the hot queue.
  candidate_max_failures: 5
  candidate_retry_backoff_seconds: [300, 1800, 7200, 21600]
  candidate_batch_size: 32
  candidate_cycle_limit: 256
  candidate_batch_concurrency: 16
  candidate_parallel_batches: 4
  candidate_batch_timeout_seconds: 20
  # Independent AIMD bounds for batch-Xray processes and expensive downloads.
  xray_concurrency_min: 4
  xray_concurrency_max: 16
  download_concurrency_min: 2
  download_concurrency_max: 8
  # A successful real download keeps a config eligible for the public feed for 24 hours.
  recent_success_retention_hours: 24
  dead_recheck_batch_size: 32
  dead_retry_recent_seconds: 7200
  dead_retry_unverified_seconds: 21600
  relay_timeout_ms: 3000
  max_relay_delay_ms: 3000
  # Stage 3 reads a tiny bounded response from two independent endpoints;
  # the quorum avoids treating a single public endpoint outage as proxy death.
  http_probe_body_limit_bytes: 16384
  http_probe_max_endpoints: 2
  http_probe_success_quorum: 1
  test_url: "https://www.cloudflare.com/cdn-cgi/trace"
  fallback_urls:
    - "https://www.gstatic.com/generate_204"
    - "https://www.google.com/generate_204"
    - "http://www.gstatic.com/generate_204"
    - "http://www.msftconnecttest.com/connecttest.txt"

download_test:
  enabled: true
  timeout_seconds: 5
  per_url_timeout_seconds: 1.5
  min_download_kbps: 100
  target_download_kbps: 1000
  test_url: "https://proof.ovh.net/files/1Mb.dat"
  fallback_urls:
    - "https://speed.cloudflare.com/__down?bytes=1000000"
    - "https://speed.cloudflare.com/__down?bytes=5000000"
    - "https://speed.cloudflare.com/__down?bytes=10000000"
    - "https://fsn1-speed.hetzner.com/100MB.bin"
    - "https://nbg1-speed.hetzner.com/100MB.bin"
    - "https://hel1-speed.hetzner.com/100MB.bin"
    - "https://ash-speed.hetzner.com/100MB.bin"
    - "https://sin-speed.hetzner.com/100MB.bin"
    - "https://proof.ovh.net/files/10Mb.dat"
    - "https://proof.ovh.net/files/100Mb.dat"
    - "https://proof.ovh.net/files/1Gb.dat"
    - "http://speedtest.newark.linode.com/100MB-newark.bin"
    - "http://speedtest.london.linode.com/100MB-london.bin"
    - "http://speedtest.frankfurt.linode.com/100MB-frankfurt.bin"
    - "http://speedtest.singapore.linode.com/100MB-singapore.bin"

# Exit metadata is fetched asynchronously through an already-running proxy;
# it is cached and never changes the health evidence of that proxy.
metadata:
  enabled: true
  endpoint: "https://ipapi.co/json/"
  timeout_seconds: 5
  cache_ttl_seconds: 86400

dead_pool:
  ttl_hours: 24
  # Syntactically invalid/incompatible configs should not poison Xray batches repeatedly.
  invalid_ttl_hours: 720

client_penalty:
  broken:
    base_cooldown_seconds: 300
    max_cooldown_seconds: 21600
    jitter_ratio: 0.2
  rate_limited:
    base_cooldown_seconds: 900
    max_cooldown_seconds: 43200
    jitter_ratio: 0.2

selection:
  strategy: weighted_power_of_choices
  sample_size: 5
  weights:
    latency: 0.35
    download: 0.20
    availability: 0.20
    fairness: 0.15
    client_history: 0.10

api:
  host: "0.0.0.0"
  port: 8080
  auth_enabled: false

vip_port:
  enabled: true
  port: 5050
  check_interval_seconds: 10
  min_switch_interval_seconds: 60
  switch_threshold_score_diff: 0.15

network_guard:
  enabled: true
  check_interval_seconds: 5
  failure_threshold: 1
  recovery_threshold: 1
  minimum_successful_targets: 2
  require_http_success: true
  mass_failure_threshold_percent: 40
  sentinel_targets:
    - type: tcp
      host: "1.1.1.1"
      port: 53
    - type: tcp
      host: "8.8.8.8"
      port: 53
    - type: http
      url: "https://www.gstatic.com/generate_204"

retention:
  system_event_max_rows: 10000

assignment_ttl_seconds: 60
xray_bin: "/usr/local/bin/xray"
