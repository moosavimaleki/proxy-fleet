[package]
name = "proxy-fleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Evidence-driven local proxy fleet orchestrator"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls", "socks", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "migrate", "runtime-tokio-rustls", "sqlite", "uuid"] }
sysinfo = "0.33"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["compression-full", "cors", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.12", features = ["v4", "serde"] }
yaml_serde = "0.10"

[dev-dependencies]
http-body-util = "0.1"
proptest = "1.6"
tempfile = "3.15"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
