<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Proxy Fleet</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0b1220;color:#e5edf8}
    body{margin:0}.shell{max-width:1440px;margin:auto;padding:24px}.top{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    nav{display:flex;gap:10px;flex-wrap:wrap}a,button{color:#9bc6ff}a{font-size:.92rem;text-decoration:none}button,input,select,textarea{font:inherit;border:1px solid #2d405b;border-radius:7px;background:#111d2d;color:inherit;padding:8px}button{cursor:pointer;background:#17365c}button:hover{background:#205083}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:18px 0}.card{background:#111d2d;border:1px solid #23364f;border-radius:10px;padding:14px}.n{font-size:1.55rem;font-weight:700}.muted{color:#9aaac0;font-size:.87rem}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:15px 0}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:9px;border-bottom:1px solid #203149;text-align:left;vertical-align:top}th{color:#a9bedb;position:sticky;top:0;background:#111d2d}.table{overflow:auto;background:#111d2d;border:1px solid #23364f;border-radius:10px}.badge{border-radius:99px;padding:3px 7px;font-size:.76rem;font-weight:700;background:#263850}.ACTIVE{background:#105943}.PROBATION{background:#64531a}.CANDIDATE{background:#274b77}.DORMANT,.INVALID,.RETIRED{background:#56303b}.danger{color:#ff9da8}.ok{color:#82e3b2}pre{white-space:pre-wrap;word-break:break-word;margin:0}.hidden{display:none}textarea{width:100%;min-height:220px;box-sizing:border-box}.notice{padding:10px;border-radius:8px;margin:10px 0;background:#1d3049}.row-action{padding:3px 7px;font-size:.78rem}
  </style>
</head>
<body><main class="shell">
  <div class="top"><div><h1 style="margin:0">Proxy Fleet</h1><div id="subtitle" class="muted">Loading Rust evidence engine…</div></div>
    <nav><a href="/">Fleet</a><a href="/clients">Clients</a><a href="/diag">Diagnostics</a><a href="/logs">Logs</a><a href="/history">History</a><a href="/manual-import">Import</a><a href="/docs">Docs</a></nav></div>
  <div id="notice"></div><section id="app"></section>
</main>
<script>
const $=s=>document.querySelector(s), app=$('#app'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch(path,options);const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.message||x.error?.message||x.error||r.status);return x}
function notice(text,kind=''){ $('#notice').innerHTML=text?`<div class="notice ${kind}">${esc(text)}</div>`:'' }
function badge(s){return `<span class="badge ${esc(s)}">${esc(s)}</span>`}
function time(v){return v?new Date(v).toLocaleString():'—'} function speed(k){return k?`${Math.round(k)} KB/s`:'—'}
async function fleet(){
  const [h,n]=await Promise.all([api('/health'),api('/api/v1/nodes?page=1&page_size=100')]); const c=h.counts;
  $('#subtitle').textContent=`${h.service} · Rust ${h.version} · ${h.status}`;
  app.innerHTML=`<div class="grid">${[['active',c.active],['probation',c.probation],['candidate',c.candidate],['dormant',c.dormant],['invalid',c.invalid],['publishable',c.publishable]].map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="n">${v}</div></div>`).join('')}</div>
  <div class="controls"><select id="state"><option value="">All states</option>${['ACTIVE','PROBATION','CANDIDATE','DORMANT','INVALID','RETIRED','WAITING_FOR_PORT'].map(s=>`<option>${s}</option>`).join('')}</select><select id="country"><option value="">All countries</option>${(n.countries||[]).map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id="protocol"><option value="">All protocols</option>${['vless','vmess','trojan','ss','socks'].map(s=>`<option>${s}</option>`).join('')}</select><input id="source" placeholder="Source"><input id="failure" placeholder="Failure class"><input id="search" placeholder="Search server/hash/org"><button id="apply">Filter</button><button id="reload">Refresh sources</button><button id="cleanup">Cleanup retired</button></div><div id="nodes">${nodeTable(n.nodes)}</div>`;
  $('#apply').onclick=async()=>{try{const q=new URLSearchParams({page:1,page_size:100});[['status','#state'],['country','#country'],['protocol','#protocol'],['source','#source'],['failure_class','#failure'],['search','#search']].forEach(([key,selector])=>{const value=$(selector).value.trim();if(value)q.set(key,value)});const x=await api('/api/v1/nodes?'+q);$('#nodes').innerHTML=nodeTable(x.nodes)}catch(e){notice(e.message,'danger')}};
  $('#reload').onclick=async()=>{try{await api('/api/v1/subscriptions/reload',{method:'POST'});notice('Refresh generation scheduled.','ok')}catch(e){notice(e.message,'danger')}};
  $('#cleanup').onclick=async()=>{if(!confirm('Delete only retired nodes whose tombstone has expired?'))return;try{const x=await api('/api/v1/db/cleanup',{method:'POST'});notice(`Deleted ${x.deleted_retired} expired retired nodes.`,'ok')}catch(e){notice(e.message,'danger')}};
}
function nodeTable(nodes){return `<div class="table"><table><thead><tr><th>State</th><th>Server</th><th>Protocol</th><th>Health</th><th>Relay</th><th>Download</th><th>Lease</th><th>Next test</th><th>Failure</th><th></th></tr></thead><tbody>${nodes.map(n=>{const inconclusive=['LOCAL_OVERLOAD','ENDPOINT_FAILURE'].includes(n.last_failure_class);const revive=['DORMANT','PROBATION','CANDIDATE'].includes(n.lifecycle_state)?` <button class="row-action" onclick="reviveNode('${n.id}')">Revive</button>`:'';return `<tr><td>${badge(n.lifecycle_state)}</td><td><b>${esc(n.server)}</b><br><span class="muted">${esc(n.remark||n.id.slice(0,10))}</span></td><td>${esc(n.protocol)}:${n.remote_port||'—'}</td><td>${(n.health_score*100).toFixed(0)}%</td><td>${n.relay_delay_ms??'—'} ms</td><td>${speed(n.download_kbps)}</td><td>${time(n.publication_lease_until)}</td><td>${time(n.next_test_at)}</td><td class="${inconclusive?'muted':''}">${inconclusive?'INCONCLUSIVE · ':''}${esc(n.last_failure_class||'—')}</td><td><button class="row-action" onclick="testNode('${n.id}')">Test</button>${revive} <button class="row-action" onclick="historyNode('${n.id}')">History</button></td></tr>`}).join('')||'<tr><td colspan="10" class="muted">No nodes match this view.</td></tr>'}</tbody></table></div>`}
window.testNode=async id=>{try{await api(`/api/v1/nodes/${id}/test`,{method:'POST'});notice(`Test scheduled for ${id}.`,'ok')}catch(e){notice(e.message,'danger')}};
window.reviveNode=async id=>{if(!confirm(`Move ${id} to controlled recovery?`))return;try{await api(`/api/v1/nodes/${id}/revive`,{method:'POST'});notice(`Recovery scheduled for ${id}.`,'ok')}catch(e){notice(e.message,'danger')}};
window.historyNode=id=>location.href='/history?id='+encodeURIComponent(id);
async function clients(){const x=await api('/api/v1/clients');app.innerHTML=`<div class="card"><h2>Client circuit state</h2><div class="controls"><select id="client"><option value="">Select client</option>${x.clients.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button id="load">Load</button></div><pre id="client-data" class="muted">No client selected.</pre></div>`;$('#load').onclick=async()=>{try{$('#client-data').textContent=JSON.stringify(await api('/api/v1/client-status?client='+encodeURIComponent($('#client').value)),null,2)}catch(e){notice(e.message,'danger')}}}
async function diagnostics(){const [s,u,v,net]=await Promise.all([api('/api/v1/scheduler'),api('/api/v1/upstream'),api('/api/v1/vip'),api('/api/v1/network')]);app.innerHTML=`<div class="grid"><div class="card"><b>Scheduler</b><pre>${esc(JSON.stringify(s,null,2))}</pre></div><div class="card"><b>Upstream</b><pre>${esc(JSON.stringify(u,null,2))}</pre></div><div class="card"><b>VIP</b><pre>${esc(JSON.stringify(v,null,2))}</pre></div><div class="card"><b>Network</b><pre>${esc(JSON.stringify(net,null,2))}</pre></div></div>`}
async function logs(){const x=await api('/api/v1/logs?limit=300');app.innerHTML=`<div class="card"><h2>System logs</h2><pre>${esc(JSON.stringify(x.logs,null,2))}</pre></div>`}
function historyTable(items){return `<div class="table"><table><thead><tr><th>When</th><th>Stage</th><th>Result</th><th>Endpoint</th><th>Latency</th><th>Speed</th><th>Pressure</th><th>Evidence Δ</th></tr></thead><tbody>${items.map(x=>`<tr><td>${time(x.finished_at)}</td><td>${esc(x.test_kind||'—')}</td><td>${esc(x.failure_class||x.result||(x.ok?'SUCCESS':'FAILURE'))}</td><td>${esc(x.endpoint||'—')}</td><td>${x.latency_ms??'—'} ms</td><td>${x.download_bps?Math.round(x.download_bps/1024)+' KB/s':speed(x.download_kbps)}</td><td>${x.system_pressure??'—'}</td><td>${x.evidence_delta?`+${x.evidence_delta.alpha}/+${x.evidence_delta.beta}`:'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No evidence recorded.</td></tr>'}</tbody></table></div>`}
async function history(){const id=new URLSearchParams(location.search).get('id');app.innerHTML=`<div class="card"><h2>Node history</h2><div class="controls"><input id="node-id" value="${esc(id||'')}" placeholder="Node id"><button id="load-history">Load</button></div><div id="history-data" class="muted">Choose a node from Fleet or enter its id.</div></div>`;$('#load-history').onclick=async()=>{try{const x=await api('/api/v1/nodes/'+encodeURIComponent($('#node-id').value)+'/history?limit=200');$('#history-data').innerHTML=historyTable(x.history)}catch(e){notice(e.message,'danger)}}}
async function manualImport(){app.innerHTML=`<div class="card"><h2>Manual import</h2><p class="muted">One share link per line. Credentials are never rendered in logs.</p><textarea id="configs" placeholder="vless://…"></textarea><div class="controls"><button id="import">Validate and import</button></div><pre id="result"></pre></div>`;$('#import').onclick=async()=>{try{const x=await api('/api/v1/manual-import',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({configs:$('#configs').value})});$('#result').textContent=JSON.stringify(x,null,2);notice('Import processed.','ok')}catch(e){notice(e.message,'danger)}}}
async function docs(){const h=await api('/api/v1/health-model');app.innerHTML=`<div class="card"><h2>Evidence model</h2><p>ACTIVE requires a bounded real download. Relay/HTTP evidence can extend a short publication lease, but cannot promote a candidate to ACTIVE.</p><pre>${esc(JSON.stringify(h,null,2))}</pre></div>`}
const pages={'/':fleet,'/clients':clients,'/diag':diagnostics,'/logs':logs,'/history':history,'/manual-import':manualImport,'/docs':docs};(pages[location.pathname]||fleet)().catch(e=>{notice(e.message,'danger');app.innerHTML='<div class="card">The API request failed. Check Diagnostics or service logs.</div>'});
</script></body></html>
