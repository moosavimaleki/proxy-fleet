<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxy Fleet</title><style>body{font:15px system-ui,sans-serif;margin:2rem;background:#10151d;color:#e7edf5}main{max-width:960px;margin:auto}.card{background:#18212d;border-radius:10px;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main><h1>Proxy Fleet</h1><div class="card"><strong>Rust evidence engine</strong><p id="status">Loading fleet status…</p></div><div class="card"><pre id="data"></pre></div></main><script>fetch('/health').then(r=>r.json()).then(x=>{document.querySelector('#status').textContent=x.status;document.querySelector('#data').textContent=JSON.stringify(x,null,2)}).catch(e=>document.querySelector('#status').textContent=e)</script></body></html>
